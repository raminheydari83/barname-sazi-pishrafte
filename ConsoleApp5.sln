using System;

public class Exercise2
{
    public static void Main(string[] args)
    {
        Console.Write("Enter a number: ");
        
        // Reading the input and converting to an integer
        int number;

        if (int.TryParse(Console.ReadLine(), out number))
        {
            // The condition: check if the number is a multiple of 7 (number % 7 == 0)
            if (number % 7 == 0)
            {
                Console.WriteLine("YES!");
            }
            else
            {
                // If not a multiple of 7, multiply by 3 and display the result
                int result = number * 3;
                Console.WriteLine(result);
            }
        }
        else
        {
            // Optional: Error message for invalid input
            Console.WriteLine("Invalid input. Please enter an integer.");
        }
        
        Console.ReadKey();
    }
}

